# Example ImageSetConfiguration for mirroring OpenShift on OCI into a
# disconnected registry.
#
# This covers the images that THIS repository's manifests reference. The
# OpenShift release payload is handled by the platform: section below; every
# other entry is an image the OCI integration pulls that the payload does not
# contain.
#
# Usage, roughly:
#
#   oc-mirror --v2 --config docs/imageset-config.yaml \
#     --workspace file:///path/to/workspace \
#     docker://registry.example.com/openshift
#
# For the fully-disconnected two-stage flow (mirror to disk on a connected
# host, carry the disk across, then mirror to the registry) and for the
# resource requirements, see the Red Hat documentation on the oc-mirror
# plugin v2. oc-mirror writes out an ImageDigestMirrorSet and an
# ImageTagMirrorSet; both are needed, since some of the images below are
# referenced by tag rather than by digest.
#
# Keeping this file honest
# ------------------------
# This is a hand-maintained list and will drift as manifests change. To see
# every image the repository currently references:
#
#   git grep -hoE '^\s*-?\s*image: .*' -- custom_manifests/ terraform-stacks/ \
#     | sed -E 's/^\s*-?\s*image: //' | tr -d '"' | sort -u
#
# Anything that command prints and this file does not list is a gap.

kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  platform:
    channels:
      # Set these to the OpenShift version you are installing.
      - name: stable-4.22
        type: ocp
        minVersion: 4.22.0
        maxVersion: 4.22.99
    graph: true

  additionalImages:
    # ---------------------------------------------------------------------
    # OCI Cloud Controller Manager (also used by the CSI driver containers)
    #
    # Mirror the image matching the oci_driver_version you set in terraform.
    # The default is v1.36.0, listed below. The stack accepts only v1.34.0,
    # v1.35.0 and v1.36.0; pick the one matching your cluster's Kubernetes
    # minor version and replace the entry if it is not the default:
    #
    #   v1.35.0  ghcr.io/oracle/cloud-provider-oci:v1.35.0
    #   v1.34.0  ghcr.io/oracle/cloud-provider-oci:v1.34.0
    #
    # custom_manifests/oci-ccm-csi-drivers/ also carries older versions that
    # the terraform stack no longer accepts. Mirror these only if you are
    # applying those manifests by hand:
    #
    #   v1.33.1      ghcr.io/oracle/cloud-provider-oci:v1.33.1
    #   v1.32.2      ghcr.io/oracle/cloud-provider-oci:v1.32.2
    #   v1.32.0      ghcr.io/oracle/cloud-provider-oci:v1.32.0
    #   v1.32.0-UHP  ghcr.io/dfoster-oracle/cloud-provider-oci-amd64:v1.32.0-UHP-LA
    #   v1.30.0      ghcr.io/oracle/cloud-provider-oci:v1.30.0
    - name: ghcr.io/oracle/cloud-provider-oci:v1.36.0

    # ---------------------------------------------------------------------
    # OCI CSI driver sidecars
    - name: registry.k8s.io/sig-storage/csi-provisioner:v5.0.1
    - name: registry.k8s.io/sig-storage/csi-attacher:v4.6.1
    - name: registry.k8s.io/sig-storage/csi-resizer:v1.11.1
    - name: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
    - name: registry.k8s.io/sig-storage/csi-snapshotter:v6.3.0
    - name: registry.k8s.io/sig-storage/snapshot-controller:v6.3.0

    # ---------------------------------------------------------------------
    # OpenShift CLI, used as an init container in the CCM DaemonSet and by
    # the autoscaling operator.
    - name: quay.io/openshift/origin-cli:4.20

    # ---------------------------------------------------------------------
    # Autoscaler. Only needed with use_autoscaling_operator = true.
    #
    # Mirroring this image is necessary but NOT sufficient. The autoscaling
    # operator also fetches three manifests over HTTPS from github.com at
    # runtime, which no registry mirror can satisfy:
    #
    #   cert-manager.yaml                from cert-manager/cert-manager
    #   core-components.yaml             from kubernetes-sigs/cluster-api
    #   infrastructure-components.yaml   from oracle/cluster-api-provider-oci
    #
    # See terraform-stacks/shared_modules/manifest/autoscaling/main.tf. Those
    # manifests in turn reference further images that are not listed here.
    # The autoscaler is therefore not usable in a disconnected cluster today.
    - name: ghcr.io/oracle-samples/openshift-oracle-capi-autoscaling:latest

    # ---------------------------------------------------------------------
    # Oracle Cloud Agent. Optional, and the pull URL is tenancy-specific, so
    # it cannot be given concretely here. Uncomment and fill in to match the
    # oca_image_pull_link you pass to terraform. Not available in every
    # realm.
    # - name: <region>.ocir.io/<namespace>/<repo>:<version>
